<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A股市场拼图 · Guohua Hu</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101722;color:#e9edf5;font:14px/1.55 system-ui,-apple-system,"Microsoft YaHei",sans-serif}header{padding:22px max(20px,4vw) 10px;display:flex;justify-content:space-between;gap:20px;align-items:center}h1{font-size:25px;margin:0}a{color:#9bbdff}main{padding:0 max(20px,4vw) 30px}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0}select,input,button{background:#263346;color:#f5f7fa;border:1px solid #45536b;border-radius:6px;padding:7px}button{cursor:pointer}.hint{color:#a8b5c6;font-size:12px}#canvas{position:relative;width:100%;height:min(74vh,850px);min-height:420px;background:#1b2533;border:1px solid #354358;border-radius:8px;overflow:hidden}#map{width:100%;height:100%}.tile{stroke:#17202d;stroke-width:.55;cursor:pointer}.tile:hover{stroke:#fff;stroke-width:2}.sector{fill:none;stroke:#f1f4ff;stroke-opacity:.7;stroke-width:1.8;pointer-events:none}.sector-label{font-size:12px;fill:white;paint-order:stroke;stroke:#151c28;stroke-width:3px;pointer-events:none;font-weight:700}.tip{position:absolute;pointer-events:none;background:#0b101beF;border:1px solid #77869c;border-radius:6px;padding:8px 11px;display:none;white-space:nowrap;z-index:3}.legend{display:flex;align-items:center;gap:3px;font-size:11px;color:#b6c0cd}.swatch{width:30px;height:10px}#status{margin:4px 0 10px;color:#b6c0cd}.empty{padding:40px;text-align:center;color:#c7d2e2}footer{font-size:12px;color:#98a5b6;padding:10px 0 25px} @media(max-width:700px){header{align-items:flex-start;flex-direction:column}#canvas{height:60vh}}
</style></head><body>
<header><div><h1>A股市场拼图</h1><div class="hint">固定面积 · 行业分区 · 历史涨跌回放</div></div><a href="/">← 返回博客</a></header>
<main><div class="controls"><label>交易日 <select id="date"></select></label><button id="prev">◀ 前一天</button><button id="next">后一天 ▶</button><button id="play">▶ 播放</button><label>查找股票 <input id="search" placeholder="代码或名称" maxlength="20"></label><span class="legend">跌 <span class="swatch" style="background:#167e60"></span><span class="swatch" style="background:#3b9b7a"></span><span class="swatch" style="background:#59636d"></span><span class="swatch" style="background:#be4a51"></span><span class="swatch" style="background:#e34449"></span> 涨</span></div>
<div id="status">正在读取市场数据……</div><div id="canvas"><svg id="map" viewBox="0 0 1200 720" preserveAspectRatio="none"></svg><div id="tip" class="tip"></div></div>
<footer>面积：首次发布时的总市值（固定基准）；颜色：当日涨跌幅。数据来自公开行情接口，未独立核验逐股时间戳，仅供观察，不构成投资建议。仅展示公开市场数据，不包含个人持仓或交易信息。</footer></main>
<script>
"use strict";
const root="data/", NS="http://www.w3.org/2000/svg", W=1200,H=720;
let layout=[],dates=[],current=0,tiles=[],groups=[],values=new Map(),timer=null;
const $=id=>document.getElementById(id);
function rect(parent,x,y,w,h,cls,fill){let r=document.createElementNS(NS,"rect");for(let [k,v] of Object.entries({x,y,width:w,height:h,class:cls}))r.setAttribute(k,v);if(fill)r.setAttribute("fill",fill);parent.appendChild(r);return r;}
function text(parent,x,y,label){let t=document.createElementNS(NS,"text");t.setAttribute("x",x);t.setAttribute("y",y);t.setAttribute("class","sector-label");t.textContent=label;parent.appendChild(t);}
function partition(items,x,y,w,h,callback){
 if(!items.length||w<=0||h<=0)return;
 if(items.length===1){callback(items[0],x,y,w,h);return;}
 const total=items.reduce((s,a)=>s+a.weight,0),half=total/2;let acc=0,k=0;
 while(k<items.length-1 && acc+items[k].weight<half){acc+=items[k].weight;k++;}
 if(k===0){k=1;acc=items[0].weight;}
 let ratio=acc/total;
 if(w>=h){let split=w*ratio;partition(items.slice(0,k),x,y,split,h,callback);partition(items.slice(k),x+split,y,w-split,h,callback);}
 else{let split=h*ratio;partition(items.slice(0,k),x,y,w,split,callback);partition(items.slice(k),x,y+split,w,h-split,callback);}
}
function color(v){if(v===undefined)return "#4d5867";let t=Math.min(Math.abs(v)/7,1);if(Math.abs(v)<0.1)return "#66717d";return v>0?`rgb(${Math.round(129+95*t)},${Math.round(77-25*t)},${Math.round(81-16*t)})`:`rgb(${Math.round(64-39*t)},${Math.round(130+28*t)},${Math.round(108-12*t)})`;}
function drawLayout(){
 const svg=$("map");svg.replaceChildren();tiles=[];groups=[];
 const by=new Map();for(let s of layout){const name=s[2]||"其他";if(!by.has(name))by.set(name,[]);by.get(name).push({code:s[0],name:s[1],weight:Math.max(1,s[3])});}
 const sectors=[...by].map(([name,items])=>({name,items:items.sort((a,b)=>b.weight-a.weight),weight:items.reduce((s,a)=>s+a.weight,0)})).sort((a,b)=>b.weight-a.weight);
 partition(sectors,0,0,W,H,(sector,x,y,w,h)=>{
  partition(sector.items,x,y,w,h,(stock,sx,sy,sw,sh)=>{let r=rect(svg,sx,sy,sw,sh,"tile","#59636d");r.dataset.code=stock.code;r.dataset.name=stock.name;r.dataset.sector=sector.name;tiles.push(r);});
  groups.push({x,y,w,h,name:sector.name});
 });
 for(let g of groups){rect(svg,g.x,g.y,g.w,g.h,"sector");if(g.w>40&&g.h>24)text(svg,g.x+5,g.y+15,g.name);}
 svg.addEventListener("pointermove",e=>{const r=e.target;if(!r.classList.contains("tile")){$("tip").style.display="none";return;}const v=values.get(r.dataset.code);const tip=$("tip");tip.textContent=`${r.dataset.name} (${r.dataset.code}) · ${r.dataset.sector} · ${v===undefined?"无报价":(v>0?"+":"")+v.toFixed(2)+"%"}`;tip.style.display="block";let box=$("canvas").getBoundingClientRect();tip.style.left=Math.min(e.clientX-box.left+12,box.width-220)+"px";tip.style.top=Math.max(0,e.clientY-box.top-42)+"px";});
 svg.addEventListener("pointerleave",()=>{$("tip").style.display="none";});
}
async function show(index){
 if(index<0||index>=dates.length)return;current=index;const day=dates[index];$("date").value=day;$("status").textContent="正在加载 "+day+"……";
 try{let r=await fetch(root+day+".json");if(!r.ok)throw Error("数据不存在");let data=await r.json();values=new Map(data.rows);let search=$("search").value.trim().toLowerCase();for(let t of tiles){let match=!search||t.dataset.code.includes(search)||t.dataset.name.toLowerCase().includes(search);t.setAttribute("fill",color(values.get(t.dataset.code)));t.setAttribute("opacity",match?"1":".12");}
 $("status").textContent=`${day} · ${data.rows.length}只股票 · 行业布局固定 · 报价时间戳未经独立核验`;
 }catch(e){$("status").textContent="读取失败："+e.message;}
}
function stop(){clearInterval(timer);timer=null;$("play").textContent="▶ 播放";}
$("prev").onclick=()=>{stop();show(current-1)};$("next").onclick=()=>{stop();show(current+1)};$("date").onchange=e=>{stop();show(dates.indexOf(e.target.value))};$("search").oninput=()=>show(current);
$("play").onclick=()=>{if(timer){stop();return;}$("play").textContent="■ 停止";timer=setInterval(()=>show((current+1)%dates.length),1000)};
(async()=>{try{let [a,b]=await Promise.all([fetch(root+"layout.json"),fetch(root+"dates.json")]);if(!a.ok||!b.ok)throw Error("首次市场数据尚未生成");layout=await a.json();dates=await b.json();if(!dates.length)throw Error("暂无交易日快照");$("date").replaceChildren(...dates.map(d=>{let o=document.createElement("option");o.value=d;o.textContent=d;return o;}));drawLayout();await show(dates.length-1);}catch(e){$("status").textContent="市场地图正在初始化："+e.message+"。请先运行博客源码仓库的 Update public market map data 工作流。";}})();
</script></body></html>
